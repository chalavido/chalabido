<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חלבידו | קינוחים ברמה אחרת</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --black: #050505;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
            --gold-glow: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--black);
            font-family: 'Assistant', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .page-container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-home-btn {
            align-self: flex-start;
            font-size: 14px;
            color: var(--gold);
            text-decoration: none;
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 10px 26px;
            border-radius: 25px;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .top-home-btn:hover {
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 0 25px var(--gold);
            border-color: transparent;
            transform: translateY(-2px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-family: 'Bellefair', serif;
            font-size: clamp(38px, 5vw, 60px);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .page-subtitle {
            font-size: 18px;
            font-weight: 300;
            color: #ccc;
            letter-spacing: 3px;
        }
        

        /* גלריית התמונות עם אפקט זוהר */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 10px;
        }

        .image-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(15, 15, 15, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
            transition: all 0.4s ease;
            height: 320px;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            /* הוספת זוהר ותאורה מיוחדת לתמונות */
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6)) brightness(1.1);
            transition: all 0.5s ease;
        }

        .image-card:hover {
            border-color: rgba(252, 246, 186, 1);
            box-shadow: 0 15px 45px rgba(0,0,0,0.9), 0 0 35px rgba(212, 175, 55, 0.6);
            transform: translateY(-5px);
        }

        .image-card:hover img {
            opacity: 1;
            transform: scale(1.06);
            filter: drop-shadow(0 0 25px rgba(252, 246, 186, 0.9)) brightness(1.2);
        }

        .card-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            text-align: center;
            font-family: 'Bellefair', serif;
            font-size: 20px;
            color: #fcf6ba;
        }

        
        /* כפתור חזרה לדף המתוקים */
        .back-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: linear-gradient(135deg, var(--gold), #aa8c2c);
            color: var(--black);
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
            z-index: 100;
            border: 1px solid var(--gold-light);
        }
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }
        
        header {
            text-align: center;
            padding: 80px 20px 40px;
            animation: fadeInDown 1s ease-out;
        }

        h1 { 
            font-family: 'Playfair Display', serif; 
            color: var(--gold); 
            font-size: 4rem; 
            margin: 0;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            letter-spacing: 2px;
        }

        p.subtitle {
            color: var(--gold-light);
            font-size: 1.4rem;
            margin-top: 15px;
            font-weight: 300;
            opacity: 0.8;
        }
        
        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 40px; 
            padding: 20px 50px 80px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        
        .card { 
            background: var(--dark-gray); 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.8s forwards;
        }
        
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:nth-child(5) { animation-delay: 0.5s; }

        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.6);
        }

        .img-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.8s ease;
        }
        
        .card:hover img { 
            transform: scale(1.1) rotate(1deg); 
        }

        .card-content {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(to top, rgba(20,20,20,1) 0%, rgba(20,20,20,0.9) 100%);
            position: relative;
        }
        
        .card-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background-color: var(--gold);
        }

        .card-title {
            color: var(--gold);
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            font-family: 'Playfair Display', serif;
        }

        /* עיצוב חלון הגדלת התמונה (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            text-align: center;
        }
        .modal-content {
            max-width: 85%;
            max-height: 80vh;
            border-radius: 15px;
            box-shadow: 0 0 50px var(--gold);
            border: 2px solid var(--gold);
        }
        .close {
            position: absolute;
            top: 20px;
            left: 40px;
            color: var(--gold);
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .close:hover { color: #fff; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .gallery { padding: 20px; gap: 25px; }
            .img-container { height: 250px; }
            .back-btn { top: 15px; right: 20px; padding: 8px 18px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- כפתור חזרה לדף המתוקים -->
    <a href="sweets.html" class="back-btn">חזרה לעמוד המתוקים</a>

    <header>
        <h1>קולקציית המגשים היוקרתית</h1>
        <p class="subtitle">אמנות הפטיסרי במיטבה, עד אליכם לאירוע</p>
    </header>
    
    <div class="gallery">
        <div class="card">
            <div class="img-container" onclick="openModal('img1.jpg.jpg')">
                <img src="img1.jpg.jpg" alt="מגש קינוחי פרימיום">
            </div>
            <div class="card-content">
                <h3 class="card-title">מגש קינוחי פרימיום</h3>
            </div>
        </div>
        
        <div class="card">
            <div class="img-container" onclick="openModal('img2.jpg.jpg')">
                <img src="img2.jpg.jpg" alt="מגש פטיפורים עשיר">
            </div>
            <div class="card-content">
                <h3 class="card-title">מגש פטיפורים עשיר</h3>
            </div>
        </div>
        
        <div class="card">
            <div class="img-container" onclick="openModal('img3.jpg.jpg')">
                <img src="img3.jpg.jpg" alt="מגש מפנק">
            </div>
            <div class="card-content">
                <h3 class="card-title">מגש מאפים וגורמה</h3>
            </div>
        </div>
        
        <div class="card">
            <div class="img-container" onclick="openModal('img4.jpg.jpg')">
                <img src="img4.jpg.jpg" alt="מגש חיתוכיות ופינוקים">
            </div>
            <div class="card-content">
                <h3 class="card-title">מגש חיתוכיות ופינוקים</h3>
            </div>
        </div>
        
        <div class="card">
            <div class="img-container" onclick="openModal('img5.jpg.jpg')">
                <img src="img5.jpg.jpg" alt="מגש אירוח יוקרתי">
            </div>
            <div class="card-content">
                <h3 class="card-title">מגש אירוח יוקרתי</h3>
            </div>
        </div>
    </div>

    <!-- חלון הגדלת תמונה -->
    <div id="imgModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        function openModal(src) {
            document.getElementById('imgModal').style.display = "block";
            document.getElementById('modalImage').src = src;
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = "none";
        }
    </script>

</body>
</html>
