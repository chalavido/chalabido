<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
        <link rel="icon" type="image/png" href="LOGO.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חלבידו | קולקציית עוגות בוטיק</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa820a;
            --bg-dark: #0b0b0b;
            --card-bg: #121212;
            --text-main: #f5f5f5;
            --text-muted: #b0b0b0;
            --gold-gradient: linear-gradient(135deg, #aa820a 0%, #d4af37 50%, #f3e5ab 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            min-height: 100%;
            width: 100%;
            background-color: var(--bg-dark);
            font-family: 'Rubik', sans-serif;
            color: var(--text-main);
            overflow-x: hidden; 
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .page-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            align-self: flex-start;
            font-family: 'Rubik', sans-serif;
            font-size: 14px;
            color: var(--gold);
            text-decoration: none;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 10px 24px;
            border-radius: 30px;
            transition: all 0.4s ease;
            margin-bottom: 20px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .back-btn:hover {
            background: var(--gold-gradient);
            color: #0b0b0b;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
            border-color: transparent;
            transform: translateY(-2px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 45px;
            opacity: 0;
            animation: fadeInDown 1.2s forwards;
        }

        .page-title {
            font-family: 'Heebo', sans-serif;
            font-size: clamp(40px, 5vw, 65px);
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            line-height: 1.1;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 15px rgba(212, 175, 55, 0.3));
        }

        .page-subtitle {
            font-family: 'Rubik', sans-serif;
            font-size: clamp(14px, 1.8vw, 16px);
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .uniform-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 1250px;
            padding: 10px 0;
            justify-items: center;
        }

        .uniform-square-card {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 16 / 8.5;
            border-radius: 20px;
            cursor: pointer;
            perspective: 1000px;
            opacity: 0;
            transform: translateY(40px);
            animation: fadeInUp 0.8s forwards;
        }

        .uniform-square-card:nth-child(1) { animation-delay: 0.1s; }
        .uniform-square-card:nth-child(2) { animation-delay: 0.2s; }
        .uniform-square-card:nth-child(3) { animation-delay: 0.3s; }
        .uniform-square-card:nth-child(4) { animation-delay: 0.4s; }
        .uniform-square-card:nth-child(5) { animation-delay: 0.5s; }
        .uniform-square-card:nth-child(6) { animation-delay: 0.6s; }
        .uniform-square-card:nth-child(7) { 
            animation-delay: 0.7s; 
            grid-column: 1 / -1; 
            max-width: 600px;
            justify-self: center;
        }

        .uniform-square-card::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: linear-gradient(135deg, #aa820a, #f3e5ab, #d4af37, #5c4302, #d4af37);
            background-size: 300% 300%;
            z-index: -1;
            border-radius: 23px;
            opacity: 0.7;
            transition: opacity 0.4s ease, filter 0.4s ease;
            filter: blur(4px);
            animation: goldShimmer 6s ease infinite;
        }

        .uniform-square-card:hover::before {
            opacity: 1;
            filter: blur(8px);
        }

        @keyframes goldShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .square-inner {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            border: 2px solid rgba(212, 175, 55, 0.6);
            background-color: var(--card-bg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.05);
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .uniform-square-card:hover .square-inner {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--gold-light);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.35), inset 0 0 30px rgba(212, 175, 55, 0.15);
        }

        .square-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 1; /* הוסרת השקיפות כדי שהתמונה תיחשף בבהירות מלאה */
            filter: brightness(1.1); /* הבהרה קלה */
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease;
        }

        .uniform-square-card:hover .square-image {
            transform: scale(1.12);
            opacity: 1;
        }

        /* רקע מדורג עדין יותר שאינו מסתיר את התמונה לחלוטין אלא רק מאפשר קריאות לכיתוב */
        .square-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(11, 11, 11, 0.88) 0%, rgba(11, 11, 11, 0.5) 60%, rgba(11, 11, 11, 0.2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* מיקום הכיתוב בתחתית לנוחות צפייה בתמונה */
            align-items: center;
            padding: 30px 20px; 
            text-align: center;
            border-radius: 20px;
            transition: background 0.4s ease;
        }

        .uniform-square-card:hover .square-overlay {
            background: linear-gradient(to top, rgba(11, 11, 11, 0.92) 0%, rgba(11, 11, 11, 0.6) 60%, rgba(11, 11, 11, 0.3) 100%);
        }

        .square-overlay::after {
            content: '';
            position: absolute;
            bottom: 12px;
            width: 40px;
            height: 2px;
            background: var(--gold-gradient);
            transition: width 0.4s ease, opacity 0.4s ease;
            opacity: 0.7;
        }

        .uniform-square-card:hover .square-overlay::after {
            width: 80px;
            opacity: 1;
        }

        .square-title {
            font-family: 'Heebo', sans-serif;
            font-size: 28px;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
            transition: transform 0.3s ease;
            letter-spacing: 0.5px;
        }

        .uniform-square-card:hover .square-title {
            transform: scale(1.05);
        }

        .square-desc {
            font-family: 'Rubik', sans-serif;
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 1.5px;
            font-weight: 500;
            text-transform: uppercase;
            transition: color 0.3s ease;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .uniform-square-card:hover .square-desc {
            color: #ffffff;
        }

        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 30px;
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 850px;
            width: 100%;
            background: #141414;
            border: 2px solid var(--gold);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.4);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .lightbox-modal.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-image {
            width: 100%;
            height: 450px;
            background-size: cover;
            background-position: center;
        }

        .lightbox-details {
            padding: 35px;
            text-align: center;
            background: #141414;
        }

        .lightbox-title {
            font-family: 'Heebo', sans-serif;
            font-size: 32px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .lightbox-text {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .lightbox-close:hover {
            background: var(--gold);
            color: #0b0b0b;
            transform: rotate(90deg);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .uniform-grid {
                grid-template-columns: 1fr;
            }
            .uniform-square-card {
                max-width: 100%;
            }
            .uniform-square-card:nth-child(7) {
                grid-column: auto;
            }
            .lightbox-image {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="page-container">
        
        <a href="sweets.html" class="back-btn">← חזרה לעמוד המתוקים</a>

        <div class="page-header">
            <h1 class="page-title">עוגות בוטיק</h1>
            <p class="page-subtitle">חווית אירוח יוקרתית ומעוצבת</p>
        </div>

        <div class="uniform-grid">
            
            <div class="uniform-square-card" onclick="openLightbox('חלבידו (6).jpg', 'שוקולד ודובדבנים', 'מוס שוקולד בלגי עם דובדבני אמרנה.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('חלבידו (6).jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">שוקולד ודובדבנים</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

            <div class="uniform-square-card" onclick="openLightbox('DCIM.jpg', 'קפה וקרמל', 'שכבות ביסקוויט עם קרם מסקרפונה וקרמל.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('DCIM.jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">קפה וקרמל</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

            <div class="uniform-square-card" onclick="openLightbox('IMG_3708.jpg', 'מארז מלבני', 'מארז שקוף ואלגנטי לשכבות עוגה.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('IMG_3708.jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">מארז מלבני</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

            <div class="uniform-square-card" onclick="openLightbox('IMG_8397.jpg', 'עוגת חגיגה לבנה', 'עוגה מעוצבת עם פנינים וזילופים.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('IMG_8397.jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">עוגת חגיגה לבנה</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

            <div class="uniform-square-card" onclick="openLightbox('תמונה8.jpg', 'עוגת זהב', 'שילוב שוקולד פרימיום ועלי זהב אכילים.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('תמונה8.jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">עוגת זהב</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

            <div class="uniform-square-card" onclick="openLightbox('חלבידו (16).jpg', 'מארזים אישיים', 'עוגות אישיות בגימור יוקרתי.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('חלבידו (16).jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">מארזים אישיים</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

            <div class="uniform-square-card" onclick="openLightbox('111.jpg', 'חגיגה בעיצוב אישי', 'עוגה בהתאמה אישית לכל אירוח.')">
                <div class="square-inner">
                    <div class="square-image" style="background-image: url('111.jpg');"></div>
                    <div class="square-overlay">
                        <h3 class="square-title">חגיגה בעיצוב אישי</h3>
                        <p class="square-desc">לחץ לצפייה מקרוב</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="lightbox-modal" id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div class="lightbox-close" onclick="closeLightboxManual()">✕</div>
            <div class="lightbox-image" id="lightbox-img"></div>
            <div class="lightbox-details">
                <h3 class="lightbox-title" id="lightbox-title"></h3>
                <p class="lightbox-text" id="lightbox-text"></p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }

        class Particle {
            constructor() { this.init(); }
            init() { 
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height; 
                this.size = Math.random() * 2.5 + 0.5; 
                this.speedX = Math.random() * 0.2 - 0.1; 
                this.speedY = Math.random() * 0.2 - 0.1; 
                this.opacity = Math.random() * 0.5 + 0.1; 
            }
            update() { 
                this.x += this.speedX; 
                this.y += this.speedY; 
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1; 
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1; 
            }
            draw() { 
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`; 
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill(); 
            }
        }

        function createParticles() { 
            particles = []; 
            for (let i = 0; i < 70; i++) particles.push(new Particle()); 
        }

        function animate() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            particles.forEach(p => { p.update(); p.draw(); }); 
            requestAnimationFrame(animate); 
        }

        window.addEventListener('resize', () => { resize(); createParticles(); });
        resize(); createParticles(); animate();

        function openLightbox(imgUrl, title, desc) {
            const modal = document.getElementById('lightbox');
            document.getElementById('lightbox-img').style.backgroundImage = `url('${imgUrl}')`;
            document.getElementById('lightbox-title').innerText = title;
            document.getElementById('lightbox-text').innerText = desc;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightboxManual() {
            const modal = document.getElementById('lightbox');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                closeLightboxManual();
            }
        }
    </script>
</body>
</html>
