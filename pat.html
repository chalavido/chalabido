<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חלבידו | קולקציית פטיפורים יוקרתית</title>
    <!-- פונטים יוקרתיים מ-Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --black: #050505;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
            --gold-glow: cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--black);
            font-family: 'Assistant', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .page-container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-home-btn {
            align-self: flex-start;
            font-size: 14px;
            color: var(--gold);
            text-decoration: none;
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 10px 26px;
            border-radius: 25px;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .top-home-btn:hover {
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 0 25px var(--gold);
            border-color: transparent;
            transform: translateY(-2px);
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-family: 'Bellefair', serif;
            font-size: clamp(38px, 5vw, 60px);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .page-subtitle {
            font-size: 18px;
            font-weight: 300;
            color: #ccc;
            letter-spacing: 3px;
        }

        /* גלריית התמונות עם אפקט זוהר */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 10px;
        }

        .image-card {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: rgba(15, 15, 15, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
            transition: all 0.4s ease;
            height: 320px;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            /* הוספת זוהר ותאורה מיוחדת לתמונות */
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6)) brightness(1.1);
            transition: all 0.5s ease;
        }

        .image-card:hover {
            border-color: rgba(252, 246, 186, 1);
            box-shadow: 0 15px 45px rgba(0,0,0,0.9), 0 0 35px rgba(212, 175, 55, 0.6);
            transform: translateY(-5px);
        }

        .image-card:hover img {
            opacity: 1;
            transform: scale(1.06);
            filter: drop-shadow(0 0 25px rgba(252, 246, 186, 0.9)) brightness(1.2);
        }

        .card-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            text-align: center;
            font-family: 'Bellefair', serif;
            font-size: 20px;
            color: #fcf6ba;
        }

        @media(max-width: 768px) {
            .image-card { height: 260px; }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="page-container">
        <a href="sweets.html" class="top-home-btn">← חזרה לעמוד המתוקים</a>

        <div class="page-header">
            <h1 class="page-title">קולקציית פטיפורים יוקרתית</h1>
            <p class="page-subtitle">חגיגה של טעמים ועיצובים מרהיבים</p>
        </div>

        <div class="gallery-grid">
            <!-- תמונה ראשונה -->
            <div class="image-card">
                <img src="IMG_5006.JPG" alt="פטיפורים יוקרתיים 1">
                <div class="card-caption">פטיפורי שף מעוצבים</div>
            </div>

            <!-- תמונה שנייה -->
            <div class="image-card">
                <img src="תמונה9.JPG" alt="פטיפורים יוקרתיים 2">
                <div class="card-caption">כיפות שוקולד וזהב</div>
            </div>

            <!-- תמונה שלישית -->
            <div class="image-card">
                <img src="תמונה10.JPG" alt="פטיפורים יוקרתיים 3">
                <div class="card-caption">מבחר פטיפורים בגימור מוזהב</div>
            </div>
        </div>
    </div>

    <script>
        // רקע חלקיקים נוצצים
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.init();
            }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            createParticles();
        });
        resize();
        createParticles();
        animate();
    </script>
    <!-- מודאל תצוגה מוגדלת -->
    <div class="modal-overlay" id="luxuryModal" onclick="closeModalOutside(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-img" id="modalImage"></div>
            <div class="modal-text">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
            </div>
        </div>
    </div>

    <script>
        function openModal(imgUrl, title, desc) {
            const modal = document.getElementById('luxuryModal');
            document.getElementById('modalImage').style.backgroundImage = `url('${imgUrl}')`;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('luxuryModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOutside(e) {
            if (e.target.id === 'luxuryModal') {
                closeModal();
            }
        }
    </script>
</body>
</html>
