<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חלבידו | קונדיטוריית בוטיק יוקרתית</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --black: #000000;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--black);
            font-family: 'Assistant', sans-serif;
            color: #ffffff;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
        }

        .logo-box {
            width: 320px;
            max-width: 85%;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
        }

        .logo-box img { width: 100%; height: auto; display: block; }

        .brand-centerpiece { text-align: center; margin: 15px 0; }

        .brand-title {
            font-family: 'Bellefair', serif;
            font-size: clamp(45px, 6vw, 75px);
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .brand-slogan {
            font-family: 'Assistant', sans-serif;
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 300;
            color: #e0e0e0;
            letter-spacing: 3px;
        }

        .tiles-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            width: 100%;
            max-width: 950px;
            padding: 0 20px;
            margin-bottom: 15px;
        }

        .card-link { text-decoration: none; color: inherit; display: block; }

        .category-card {
            height: 40vh; 
            max-height: 320px;
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.6);
            border-radius: 32px;
            overflow: hidden;
            cursor: pointer;
            perspective: 1000px;
            background-color: #0a0a0a;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            border-radius: 32px;
        }

        .card-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.45;
            transition: opacity 0.5s ease, transform 0.8s ease;
            border-radius: 32px;
        }

        .category-card:hover .card-image { opacity: 0.65; transform: scale(1.08); }

        .card-title {
            position: relative;
            z-index: 10;
            padding-bottom: 30px;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            text-align: center;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
        }

        .card-title h2 {
            font-family: 'Bellefair', serif;
            font-size: clamp(26px, 4vw, 42px);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .card-title .decoration {
            width: 45px;
            height: 1.5px;
            background: var(--gold);
            margin: 8px auto 0;
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .category-card:hover .decoration { transform: scaleX(1); }

        .footer-tag { font-size: 12px; color: rgba(212, 175, 55, 0.4); letter-spacing: 4px; text-transform: uppercase; }

        /* כפתור יצירת קשר - ממוקם בשמאל */
        .contact-container {
            position: fixed;
            bottom: 40px;
            left: 5%; 
            width: 150px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .contact-label {
            font-family: 'Assistant', sans-serif;
            color: var(--gold);
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.9;
            font-weight: 600;
        }

        .email-float-btn {
            width: 100px;
            height: 70px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid var(--gold);
        }

        .email-float-btn:hover { transform: scale(1.1); box-shadow: 0 0 40px rgba(212, 175, 55, 0.6); }

        .gmail-icon {
            width: 45px;
            height: 35px;
            background: conic-gradient(from 180deg at 50% 50%, #ea4335 0deg, #4285f4 90deg, #34a853 180deg, #fbbc05 270deg, #ea4335 360deg);
            -webkit-mask: url('https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg') no-repeat center;
            mask: url('https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg') no-repeat center;
        }

        @media (max-width: 768px) {
            .tiles-wrapper { grid-template-columns: 1fr; gap: 15px; }
            .category-card { height: 22vh; border-radius: 24px; }
            .logo-box { width: 240px; }
            .main-container { padding: 20px 15px; }
            .contact-container { left: 50%; transform: translateX(-50%); } 
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="main-container">
        <div class="logo-box">
            <img src="logo.png" alt="לוגו חלבידו" onerror="this.src='https://placehold.co/400x150/000/d4af37?text=CHALAVIDO'">
        </div>

        <div class="brand-centerpiece">
            <h1 class="brand-title">חלבידו</h1>
            <p class="brand-slogan">כשעיצוב יוקרתי פוגש טעם בלתי נשכח</p>
        </div>

        <div class="tiles-wrapper">
            <a href="fingerfood.html" class="card-link">
                <div class="category-card js-tilt">
                    <div class="card-inner">
                        <div class="card-image" style="background-image: url('ff.png');"></div>
                        <div class="card-title">
                            <h2>פינגר-פוד</h2>
                            <div class="decoration"></div>
                        </div>
                    </div>
                </div>
            </a>

            <a href="sweets.html" class="card-link">
                <div class="category-card js-tilt">
                    <div class="card-inner">
                        <div class="card-image" style="background-image: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=800');"></div>
                        <div class="card-title">
                            <h2>מתוקים</h2>
                            <div class="decoration"></div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <div class="footer-tag">Boutique Dairy Pastry & Catering</div>
    </div>

    <div class="contact-container">
        <div class="contact-label">ליצירת קשר</div>
        <a href="contact.html" class="email-float-btn">
            <div class="gmail-icon"></div>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        function createParticles() {
            particles = [];
            for (let i = 0; i < 100; i++) particles.push(new Particle());
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        const cards = document.querySelectorAll('.js-tilt');
        cards.forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (centerY - y) / 20;
                const rotateY = (x - centerX) / 20;
                card.querySelector('.card-inner').style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });
            card.addEventListener('mouseleave', () => {
                card.querySelector('.card-inner').style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
            });
        });
        window.addEventListener('resize', resize);
        resize();
        createParticles();
        animate();
    </script>
</body>
</html>
